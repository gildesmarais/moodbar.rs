[package]
name = "moodbar-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Re-export facade and core DSP pipeline for moodbar audio visualization"
readme = "README.md"

[features]
default = ["decode", "png"]
decode = ["dep:moodbar-decode"]
png = ["moodbar-analysis/png"]

[dependencies]
moodbar-analysis = { workspace = true, default-features = false }
moodbar-decode = { workspace = true, optional = true }

[dev-dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
image.workspace = true
