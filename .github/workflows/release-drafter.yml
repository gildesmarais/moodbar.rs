name: release-drafter

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-release-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Update release draft
        uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
