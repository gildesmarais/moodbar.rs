name: native-ci

on:
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
      - "crates/moodbar-analysis/**"
      - "crates/moodbar-bindings-schema/**"
      - "crates/moodbar-decode/**"
      - "crates/moodbar-native-ffi/**"
      - "packages/moodbar-native/**"
      - "scripts/build-native-*.sh"
      - "scripts/prepare-package.mjs"
      - "scripts/verify-npm-package.mjs"
      - ".github/workflows/native-ci.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
      - "crates/moodbar-analysis/**"
      - "crates/moodbar-bindings-schema/**"
      - "crates/moodbar-decode/**"
      - "crates/moodbar-native-ffi/**"
      - "packages/moodbar-native/**"
      - "scripts/build-native-*.sh"
      - "scripts/prepare-package.mjs"
      - "scripts/verify-npm-package.mjs"
      - ".github/workflows/native-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_VERSION: "22.22.0"
      NPM_VERSION: "11.8.0"
      ANDROID_NDK_VERSION: "27.1.12297006"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      # Uses the runner's preinstalled SDK; setup-android@v3 requested the
      # deprecated 'tools' package, which Google no longer serves.
      - name: Install pinned Android NDK
        run: |
          sdkmanager="${ANDROID_HOME:?runner has no Android SDK}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager" || { echo "::error::sdkmanager missing at $sdkmanager"; exit 1; }
          ndk="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          if [ ! -d "$ndk" ]; then
            (yes || true) | "$sdkmanager" --licenses > /dev/null
            "$sdkmanager" --install "ndk;${ANDROID_NDK_VERSION}"
          fi
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "packages/moodbar-native/package.json"

      - name: Pin npm
        run: npm install -g "npm@${NPM_VERSION}"

      - name: Build Android native artifacts
        run: make native-android

      - name: Validate npm package contract
        run: make publish-check-native-android

  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      NODE_VERSION: "22.22.0"
      NPM_VERSION: "11.8.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "packages/moodbar-native/package.json"

      - name: Pin npm
        run: npm install -g "npm@${NPM_VERSION}"

      - name: Build iOS native artifacts
        run: make native-ios

      - name: Validate npm package contract
        run: make publish-check-native-ios
