name: wasm-ci

on:
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
      - "crates/moodbar-analysis/**"
      - "crates/moodbar-bindings-schema/**"
      - "crates/moodbar-wasm/**"
      - "scripts/prepare-package.mjs"
      - "scripts/verify-npm-package.mjs"
      - ".github/workflows/wasm-ci.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
      - "crates/moodbar-analysis/**"
      - "crates/moodbar-bindings-schema/**"
      - "crates/moodbar-wasm/**"
      - "scripts/prepare-package.mjs"
      - "scripts/verify-npm-package.mjs"
      - ".github/workflows/wasm-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WASM_PACK_VERSION: "0.13.1"
      NODE_VERSION: "22.22.0"
      NPM_VERSION: "11.8.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@${{ env.WASM_PACK_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Pin npm
        run: npm install -g "npm@${NPM_VERSION}"

      - name: Validate publishable WASM package
        run: make publish-check-wasm
